aid: invoice-2go
name: Invoice 2go
description: 'Invoice 2go is invoicing and estimate software for micro and small businesses, letting owners
  create and send branded invoices and estimates, accept online card and bank payments, track expenses and
  projects, and run business reports from mobile and web apps. Founded in 2002 and headquartered in Sydney
  and Palo Alto, the company was backed by Accel and was acquired by BILL (Bill.com) in 2021 for roughly $625
  million, where it now operates as part of the BILL platform. Invoice 2go no longer publishes a first-party
  public developer API — its former developer portal and GitHub organization have been retired/archived —
  and it consumes third-party accounting APIs (via Apideck) for its integrations surface. This profile tracks
  the company identity, security posture, and public web properties.'
